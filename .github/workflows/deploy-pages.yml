name: Deploy Fuori Forno to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Configure public URL and base path
        shell: bash
        env:
          CONFIGURED_SITE_URL: ${{ vars.SITE_URL }}
          CONFIGURED_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
        run: |
          REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"

          if [[ -n "$CONFIGURED_SITE_URL" ]]; then
            SITE_URL="${CONFIGURED_SITE_URL%/}"
            BASE_PATH="${CONFIGURED_BASE_PATH%/}"
          elif [[ "$REPOSITORY_NAME" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            BASE_PATH=""
            SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          else
            BASE_PATH="/$REPOSITORY_NAME"
            SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io${BASE_PATH}"
          fi

          echo "NEXT_PUBLIC_BASE_PATH=$BASE_PATH" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=$SITE_URL" >> "$GITHUB_ENV"

      - name: Build static site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

